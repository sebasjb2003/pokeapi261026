<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex Sebas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet" />
    <link href="./styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container-fluid">
            <div class="row bg-primary">
                <div class="col-12 col-md-2 logo-container d-flex justify-content-center">
                    <img src="img/logo.png" class="img-fluid w-50">
                    <span class="my-auto">Pokedex Sebas</span>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="col-12 col-md-8 navbar-container">
                    <nav class="navbar navbar-expand-lg">
                        <div class="container-fluid">
                            
                            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav main-menu">
                                    <li class="nav-item">
                                        <a class="nav-link" aria-current="page" href="#">Acerca de</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">Inicio</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">Pokemon</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">Favoritos</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
                <div class="col-12 col-md-2">
                </div>               
            </div>
        </div>
    </header>

<main class="container-fluid py-4">
    <div class="libro">

        <!-- Página izquierda -->
        <section class="pagina pagina-izq">
            <form id="formBusqueda">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="busqueda" class="form-control"
                           placeholder="Nombre o número (ej: pikachu)" required>
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>

            <!-- Aquí irán los filtros (pasos 4 y 5) -->

            <ul id="listaPokemon" class="lista-pokemon"></ul>
        </section>

        <!-- Página derecha -->
        <section class="pagina pagina-der">
            <div id="resultado"></div>

            <div id="navegacion" class="d-flex gap-2 mt-3" hidden>
                <button id="btnAnterior" class="btn btn-outline-primary" type="button">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button id="btnSiguiente" class="btn btn-outline-primary" type="button">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </section>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./scripts.js"></script>
    </main>
    <footer>
        <script type="module" src="./scripts.js"></script>
    </footer>
</body>
</html>
